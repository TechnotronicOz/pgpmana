<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#323230"/>
      <stop offset="1" stop-color="#1a1a18"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A9BE0"/>
      <stop offset="1" stop-color="#3C7DC4"/>
    </linearGradient>
    <linearGradient id="skinDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3C7DC4"/>
      <stop offset="1" stop-color="#2B629F"/>
    </linearGradient>
    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <clipPath id="headClip">
      <circle cx="512" cy="420" r="138"/>
    </clipPath>
  </defs>

  <!-- Tile -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>

  <g clip-path="url(#tile)">
    <!-- Torso -->
    <path d="M380 620 Q384 560 446 554 L578 554 Q640 560 644 620 L686 940 L338 940 Z" fill="url(#skinDark)"/>
    <!-- Belly highlight -->
    <ellipse cx="512" cy="760" rx="110" ry="150" fill="#4F8FD3" opacity="0.55"/>

    <!-- Left arm: upper arm, biceps, forearm, fist -->
    <path d="M420 624 Q330 652 262 604" fill="none" stroke="#3A7AC0" stroke-width="74" stroke-linecap="round"/>
    <ellipse cx="322" cy="590" rx="60" ry="50" fill="#4A8BD2"/>
    <ellipse cx="310" cy="570" rx="24" ry="13" fill="#8BBDF0" opacity="0.7"/>
    <path d="M262 604 L248 472" fill="none" stroke="#3C7DC4" stroke-width="64" stroke-linecap="round"/>
    <rect x="212" y="482" width="72" height="26" rx="8" fill="#F2BE52"/>
    <circle cx="248" cy="440" r="46" fill="#4A8BD2"/>
    <path d="M222 430 Q248 418 274 430" fill="none" stroke="#2B629F" stroke-width="6" stroke-linecap="round"/>

    <!-- Right arm (mirror) -->
    <path d="M604 624 Q694 652 762 604" fill="none" stroke="#3A7AC0" stroke-width="74" stroke-linecap="round"/>
    <ellipse cx="702" cy="590" rx="60" ry="50" fill="#4A8BD2"/>
    <ellipse cx="714" cy="570" rx="24" ry="13" fill="#8BBDF0" opacity="0.7"/>
    <path d="M762 604 L776 472" fill="none" stroke="#3C7DC4" stroke-width="64" stroke-linecap="round"/>
    <rect x="740" y="482" width="72" height="26" rx="8" fill="#F2BE52"/>
    <circle cx="776" cy="440" r="46" fill="#4A8BD2"/>
    <path d="M750 430 Q776 418 802 430" fill="none" stroke="#2B629F" stroke-width="6" stroke-linecap="round"/>

    <!-- Flex sparks -->
    <g stroke="#F2BE52" stroke-width="10" stroke-linecap="round">
      <path d="M190 360 L168 336"/>
      <path d="M232 340 L230 306"/>
      <path d="M160 410 L128 404"/>
      <path d="M834 360 L856 336"/>
      <path d="M792 340 L794 306"/>
      <path d="M864 410 L896 404"/>
    </g>

    <!-- Ears -->
    <ellipse cx="392" cy="396" rx="88" ry="112" transform="rotate(-14 392 396)" fill="#3577BD"/>
    <ellipse cx="402" cy="400" rx="58" ry="80" transform="rotate(-14 402 400)" fill="#6FA8E3"/>
    <ellipse cx="632" cy="396" rx="88" ry="112" transform="rotate(14 632 396)" fill="#3577BD"/>
    <ellipse cx="622" cy="400" rx="58" ry="80" transform="rotate(14 622 400)" fill="#6FA8E3"/>

    <!-- Head -->
    <circle cx="512" cy="420" r="138" fill="url(#skin)"/>
    <!-- Gold headband -->
    <rect x="360" y="318" width="304" height="34" fill="#F2BE52" clip-path="url(#headClip)"/>
    <path d="M640 330 L690 312 L684 346 Z" fill="#E8AA3C"/>
    <path d="M640 340 L694 352 L670 376 Z" fill="#E8AA3C"/>

    <!-- Brows -->
    <path d="M444 382 L490 396" stroke="#1B3F66" stroke-width="12" stroke-linecap="round"/>
    <path d="M580 382 L534 396" stroke="#1B3F66" stroke-width="12" stroke-linecap="round"/>
    <!-- Eyes -->
    <ellipse cx="468" cy="422" rx="15" ry="18" fill="#0F2740"/>
    <circle cx="473" cy="415" r="5" fill="#FAFAF8"/>
    <ellipse cx="556" cy="422" rx="15" ry="18" fill="#0F2740"/>
    <circle cx="561" cy="415" r="5" fill="#FAFAF8"/>

    <!-- Tusks -->
    <path d="M478 490 Q462 520 476 540 Q480 518 494 500 Z" fill="#F5F3EE"/>
    <path d="M546 490 Q562 520 548 540 Q544 518 530 500 Z" fill="#F5F3EE"/>

    <!-- Trunk, raised -->
    <path d="M512 462 C512 540 536 586 584 584 C618 582 632 552 622 528" fill="none" stroke="url(#skin)" stroke-width="50" stroke-linecap="round"/>
    <path d="M500 500 Q512 506 524 500" fill="none" stroke="#2B629F" stroke-width="5" stroke-linecap="round"/>
    <path d="M502 530 Q514 538 528 532" fill="none" stroke="#2B629F" stroke-width="5" stroke-linecap="round"/>
    <path d="M520 562 Q532 572 548 566" fill="none" stroke="#2B629F" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="622" cy="524" rx="17" ry="12" transform="rotate(-30 622 524)" fill="#2B629F"/>

    <!-- Gold key on chest -->
    <g fill="none" stroke="#F2BE52" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="512" cy="700" r="32"/>
      <path d="M512 732 L512 820"/>
      <path d="M512 782 L540 782"/>
      <path d="M512 808 L534 808"/>
    </g>
  </g>

  <!-- Hairline edge -->
  <rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#3A3A36" stroke-width="1"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
